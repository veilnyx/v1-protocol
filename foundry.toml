[profile.default]
solc = "0.8.24"
evm_version = "cancun"
ffi = true
ast = true
via-ir = false
optimizer = true
optimizer-runs = 1_000_000
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read-write", path = "./" }]

# Per-file optimizer override for Pool: it sits close to the EIP-170 24,576-byte
# runtime limit, so we compile it with low runs (favoring smaller bytecode over
# runtime gas). All other contracts keep the global 1M runs.
#
# `additional_compiler_profiles` defines a named profile; `compilation_restrictions`
# pins Pool.sol to that profile. Files Pool depends on get compiled in both
# profiles (slightly slower builds), but only the Pool runtime bytecode itself
# uses the low-runs variant.
additional_compiler_profiles = [
    { name = "pool_small", optimizer_runs = 200 },
]

compilation_restrictions = [
    { paths = "src/core/Pool.sol", optimizer_runs = 200 },
]

[profile.lite]
optimizer = false

[profile.ci.fuzz]
runs = 10_000

[rpc_endpoints]
tenderly = "${RPC_TENDERLY}"
eth_sepolia = "${RPC_ETH_SEPOLIA}"
op_sepolia = "${RPC_OPTIMISM_SEPOLIA}"
polygon_amoy = "${RPC_POLYGON_AMOY}"

[lint]
lint_on_build = false